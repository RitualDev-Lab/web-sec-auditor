name: WebSecAuditor Enterprise Security Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 06:00 UTC

permissions: read-all

jobs:
  security-audit:
    name: Multi-Vector Cybersecurity Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for secret hunting

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Auditor
        run: pnpm run build

      - name: Run WebSecAuditor Unified Security Gate
        run: |
          node dist/cli.js audit . \
            --sarif results.sarif \
            --html report.html \
            --ignore-test-files \
            --fail-on HIGH

      - name: Upload SARIF to GitHub Advanced Security
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.28.11
        with:
          sarif_file: results.sarif
          category: web-sec-auditor

      - name: Archive HTML Executive Dashboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: web-sec-auditor-report
          path: report.html
