name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all

jobs:
  publish:
    name: Publish to npm & GitHub Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Test Suite
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Generate SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.0.0
        with:
          subject-path: 'dist/**'

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: 'cyclonedx-json'
          output-file: 'dist/web-sec-auditor-cyclonedx.sbom.json'
          artifact-name: 'web-sec-auditor-cyclonedx.sbom.json'
          upload-artifact: true
          upload-release-assets: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: 'spdx-json'
          output-file: 'dist/web-sec-auditor-spdx.sbom.json'
          artifact-name: 'web-sec-auditor-spdx.sbom.json'
          upload-artifact: true
          upload-release-assets: false

      - name: Publish to npm with Provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release with SBOM Artifacts
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/web-sec-auditor-cyclonedx.sbom.json
            dist/web-sec-auditor-spdx.sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
